name: Engineering OS Records

on:
  pull_request:
  push:

jobs:
  validate-engineering-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run check
      - run: node src/cli.mjs check-project-safety --target .
